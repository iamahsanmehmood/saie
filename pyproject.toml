[project]
name = "saie"
version = "1.0.0"
description = "SAIE — SketchUp Automation & Intelligence Engine. AI-powered architectural modeling for SketchUp via the Model Context Protocol."
authors = [
    {name = "Ahsan Mehmood", email = "mail.ahsanmehmood@gmail.com"}
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
keywords = [
    "sketchup", "mcp", "ai", "architecture", "bim",
    "claude", "model-context-protocol", "automation", "3d", "cad"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Ruby",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0.0",
    "websockets>=12.0",
    "mcp>=1.20.0",
    "pillow>=10.0.0",
    "ezdxf>=1.1.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.5.0",
    "mypy>=1.5.0",
]
agent = [
    "anthropic>=0.90.0",
]
ollama = [
    "ollama>=0.3.0",
]
all = [
    "anthropic>=0.90.0",
    "ollama>=0.3.0",
]

[project.urls]
Homepage      = "https://github.com/iamahsanmehmood/saie"
Documentation = "https://github.com/iamahsanmehmood/saie/tree/main/docs"
Repository    = "https://github.com/iamahsanmehmood/saie"
Issues        = "https://github.com/iamahsanmehmood/saie/issues"
Changelog     = "https://github.com/iamahsanmehmood/saie/blob/main/CHANGELOG.md"

[project.scripts]
# Canonical commands (preferred for v1.0+)
saie         = "su_mcp_bridge.cli.sb:main"
saie-mcp     = "saie.__main__:main"
# Legacy aliases — kept stable so existing user setups keep working.
sb            = "su_mcp_bridge.cli.sb:main"
sketchup-mcp  = "saie.__main__:main"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saie", "src/su_mcp_bridge"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "ruby_plugin/",
    "docs/",
    "scripts/",
    "saie.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-v --strict-markers"
markers = [
    "integration: marks tests that need a running SketchUp bridge",
    "slow: marks slow benchmark tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
